name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the synthetic demo when possible. Do not upload private experiments.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and GelLabel version
    validations:
      required: true
